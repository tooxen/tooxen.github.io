<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none" stroke="#1D70B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <!-- 頂部根節點 (專案源頭) -->
