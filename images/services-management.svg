  <line x1="48" y1="32" x2="48" y2="40" stroke-width="2.5" />

  <!-- 下方子任務節點 1 (左) -->
  <rect x="6" y="40" width="20" height="12" rx="3.5" />
  <!-- 核取打勾 (完成標記) -->
